name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: claude plugin validate .
      - run: claude plugin test .
      - name: Determine bump type from commit messages
        id: bump
        run: |
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo "")"
          RANGE="${LAST_TAG:+$LAST_TAG..}HEAD"
          COMMITS="$(git log "$RANGE" --pretty=format:'%s%n%b')"

          BUMP="patch"
          if echo "$COMMITS" | grep -qE '(^|\n)BREAKING CHANGE|^[a-zA-Z]+(\([^)]+\))?!:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^feat(\([^)]+\))?:'; then
            BUMP="minor"
          fi

          echo "Detected bump: $BUMP (range: $RANGE)"
          echo "type=$BUMP" >> "$GITHUB_OUTPUT"
      - name: Bump plugin version and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Bumps plugin.json and the marketplace entry together; nothing is published to npm.
          VERSION="$(node -e '
            const fs = require("fs")
            const bump = process.argv[1]
            const pluginPath = ".claude-plugin/plugin.json"
            const marketPath = ".claude-plugin/marketplace.json"
            const plugin = JSON.parse(fs.readFileSync(pluginPath, "utf8"))
            let [major, minor, patch] = plugin.version.split(".").map(Number)
            if (bump === "major") [major, minor, patch] = [major + 1, 0, 0]
            else if (bump === "minor") [minor, patch] = [minor + 1, 0]
            else patch += 1
            const version = `${major}.${minor}.${patch}`
            plugin.version = version
            fs.writeFileSync(pluginPath, JSON.stringify(plugin, null, 2) + "\n")
            const market = JSON.parse(fs.readFileSync(marketPath, "utf8"))
            market.plugins.find(p => p.name === plugin.name).version = version
            fs.writeFileSync(marketPath, JSON.stringify(market, null, 2) + "\n")
            console.log(version)
          ' "${{ steps.bump.outputs.type }}")"
          git add .claude-plugin/plugin.json .claude-plugin/marketplace.json
          git commit -m "$VERSION [skip ci]"
          git tag "v$VERSION"
          git push origin main --tags
