name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: sudo apt-get install -y jq
      - run: bash test/run.sh
      - name: Determine bump type from commit messages
        id: bump
        run: |
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo "")"
          RANGE="${LAST_TAG:+$LAST_TAG..}HEAD"
          COMMITS="$(git log "$RANGE" --pretty=format:'%s%n%b')"

          BUMP="patch"
          if echo "$COMMITS" | grep -qE '(^|\n)BREAKING CHANGE|^[a-zA-Z]+(\([^)]+\))?!:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE '^feat(\([^)]+\))?:'; then
            BUMP="minor"
          fi

          echo "Detected bump: $BUMP (range: $RANGE)"
          echo "type=$BUMP" >> "$GITHUB_OUTPUT"
      - name: Bump version, tag, and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version "${{ steps.bump.outputs.type }}" --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          git add package.json
          git commit -m "$VERSION [skip ci]"
          git tag "v$VERSION"
          npm publish --access public
          git push origin main --tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
